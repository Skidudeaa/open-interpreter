[tool.poetry]
name = "cc-sidecar"
version = "0.1.0"
description = "Passive, event-sourced observability sidecar for Claude Code"
authors = ["killian <killian@openinterpreter.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "cc_sidecar", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10"
rich = ">=13.0,<15"
textual = ">=0.40,<2"
websockets = ">=12.0,<15"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.21"
pytest-cov = ">=4.0"
ruff = ">=0.4"
mypy = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.poetry.scripts]
cc-sidecar = "cc_sidecar.cli:main"

  <text x="480" y="100" class="text dim">&#x2502;</text>

  <text x="16" y="118" class="text dim">&#x2502;</text>
  <text x="28" y="118" class="text magenta">Surgeon</text>
  <text x="92" y="118" class="text dim">editing login_handler.py:44</text>
  <text x="296" y="118" class="text green">&#x2713; 1.1s</text>
